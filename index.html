<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Revisión ciudadana de las fuentes de agua de Murcia">
  <title>MurciaLab Fuentes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app">
    <div id="map" role="application" aria-label="Mapa de fuentes de Murcia"></div>

    <header id="banner" class="banner" role="banner">
      <button id="btn-progress" class="banner-btn" type="button"
              aria-expanded="false" aria-controls="progress-detail">
        <span id="btn-progress-label">Progreso —</span>
      </button>
      <button id="btn-layers" class="banner-btn" type="button"
              aria-expanded="false" aria-controls="layers-panel">
        Capas
      </button>
    </header>

    <section id="progress-detail" class="dropdown-panel dropdown-left"
             aria-label="Detalle del progreso por zona"></section>
    <section id="layers-panel" class="dropdown-panel dropdown-right"
             aria-label="Selector de capas"></section>

    <button id="btn-ubicacion" class="fab" type="button" aria-label="Centrar en mi ubicación">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              d="M12 2v3 M12 19v3 M2 12h3 M19 12h3"/>
        <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
      </svg>
    </button>

    <aside id="sheet" class="sheet" aria-hidden="true" aria-label="Detalle de fuente"></aside>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/markers.js"></script>
  <script src="js/api.js"></script>
  <script src="js/relative-time.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/map.js"></script>
  <script src="js/sheet.js"></script>
  <script src="js/form.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
